<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone - Movie Site</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo">NETFLIX</a>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">TV Shows</a></li>
        <li><a href="#">Movies</a></li>
        <li><a href="#">New & Popular</a></li>
        <li><a href="#">My List</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Titles, people, genres" />
      </div>
      <i class="fas fa-bell"></i>
      <div class="profile">
        <img src="https://i.pravatar.cc/40?img=12" alt="Profile" />
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero" id="hero">
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Inception</h1>
      <p class="hero-desc" id="heroDesc">
        A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O.
      </p>
      <div class="hero-buttons">
        <button class="btn btn-play"><i class="fas fa-play"></i> Play</button>
        <button class="btn btn-info" id="heroInfoBtn"><i class="fas fa-info-circle"></i> More Info</button>
      </div>
    </div>
    <div class="hero-fade"></div>
  </header>

  <!-- Movie Rows -->
  <main class="main-content">
    <section class="row">
      <h2 class="row-title">Trending Now</h2>
      <div class="row-posters" id="trending"></div>
    </section>

    <section class="row">
      <h2 class="row-title">Top Rated</h2>
      <div class="row-posters" id="topRated"></div>
    </section>

    <section class="row">
      <h2 class="row-title">Action Movies</h2>
      <div class="row-posters" id="action"></div>
    </section>

    <section class="row">
      <h2 class="row-title">Comedy</h2>
      <div class="row-posters" id="comedy"></div>
    </section>

    <section class="row">
      <h2 class="row-title">Horror</h2>
      <div class="row-posters" id="horror"></div>
    </section>
  </main>

  <!-- Movie Modal -->
  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div class="modal-body">
        <img id="modalPoster" src="" alt="Poster" class="modal-poster" />
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <div class="modal-meta">
            <span id="modalYear"></span>
            <span id="modalRating"></span>
            <span id="modalRuntime"></span>
          </div>
          <p id="modalOverview"></p>
          <div class="modal-buttons">
            <button class="btn btn-play"><i class="fas fa-play"></i> Play</button>
            <button class="btn btn-secondary"><i class="fas fa-plus"></i> My List</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
