<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Hub - Netflix Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial}
body{background:#141414;color:#fff}
.top{position:fixed;top:0;width:100%;padding:10px 15px;background:linear-gradient(to bottom,#000 90%,transparent);display:flex;justify-content:space-between;align-items:center;z-index:20}
.logo{color:#E50914;font-size:28px;font-weight:900}
.search input{background:#000;border:1px solid #555;color:#fff;padding:7px 12px;border-radius:4px;width:200px}
.hero{height:85vh;background:linear-gradient(to top,#141414 0%,rgba(20,20,20,.7) 50%,transparent 100%),url('https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg');background-size:cover;background-position:center top;display:flex;flex-direction:column;justify-content:flex-end;padding:25px 15px}
.hero h1{font-size:32px}.hero p{font-size:13px;color:#ddd;max-width:90%;height:48px;overflow:hidden;margin-top:6px}
.hero-actions{margin-top:14px;display:flex;gap:8px}
.btn-play{background:#fff;color:#000;padding:8px 22px;border:none;border-radius:4px;font-weight:800;cursor:pointer}
.btn-info{background:rgba(109,109,110,.7);color:#fff;padding:8px 18px;border:none;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;padding:15px}
.card{border-radius:4px;overflow:hidden;cursor:pointer;background:#222}
.card img{width:100%;height:165px;object-fit:cover}
.card-title{font-size:10px;padding:5px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:100;flex-direction:column}
.p-head{padding:12px;display:flex;justify-content:space-between;background:#000;font-size:12px}
video{width:100%;height:52vh;background:#000}
#adBar{background:#E50914;padding:8px 12px;font-size:11px;display:none;justify-content:space-between}
.quality{padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quality button{padding:5px 12px;border-radius:4px;border:1px solid #333;background:#222;color:#fff;font-size:11px}
.quality button.active{background:#fff;color:#000;font-weight:800}
.quality button.premium{background:gold;color:#000;font-weight:800;border:none}
.p-actions{padding:0 12px;display:flex;gap:8px}
.p-actions button{padding:7px 14px;border-radius:4px;border:1px solid #333;background:#222;color:#fff;font-size:11px}
#premiumModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;z-index:200;justify-content:center;align-items:center}
.modalBox{background:#181818;padding:20px;border-radius:6px;width:88%;max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="top"><div class="logo">NETFLIX</div><div class="search"><input id="search" placeholder="Titles, people, genres" oninput="doSearch()"></div></div>
<div class="hero"><h1>Inception</h1><p>A thief who steals corporate secrets through dream-sharing tech. Static Hub Netflix Clone - 600 Unique Movies.</p><div class="hero-actions"><button class="btn-play" onclick="playMovie(allMovies[0])">▶ Play</button><button class="btn-info" onclick="alert('600 Unique Titles • No Repeats • Icon+Title • Anime Dail')">ⓘ More Info</button></div></div>
<div class="grid" id="grid"></div>
<div id="player">
<div class="p-head"><span onclick="closeP()">← Back</span><span id="pTitle"></span><span id="adStatus">Ready</span></div>
<div id="adBar"><span>Ad - Less Ads • 1 ad only</span><span>Skip in <b id="timer">5</b>s <button onclick="skipAd()" style="background:#fff;color:#000;border:none;padding:3px 8px;border-radius:3px;font-weight:800">Skip →</button></span></div>
<video id="vid" controls playsinline></video>
<div class="quality"><b>Quality:</b><div id="qBtns" style="display:flex;gap:6px"></div><span style="font-size:10px;color:gold">HD Premium from 720p</span></div>
<div class="p-actions"><button onclick="downloadNow()">⬇ Download</button><button onclick="saveNow()">❤ My List</button><span id="msg" style="font-size:10px;color:#777;padding:7px"></span></div>
</div>
<div id="premiumModal"><div class="modalBox"><h3 style="color:gold">🔒 HD Premium</h3><p style="font-size:12px;margin:10px 0;color:#aaa">720p & 1080p is Premium<br>Free: 360p & 480p</p><button onclick="closePremium()">Stay Free 480p</button><button style="background:gold;color:#000;font-weight:800;padding:8px 14px;border:none;border-radius:4px" onclick="unlockPremium()">Unlock HD $1</button></div></div>
<script>
let isPremium = localStorage.getItem('static_premium')==='yes';
let current=null, currentQuality='480p';
const freeSrc={"360p":"https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4","480p":"https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4","720p":"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4","1080p":"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"};

// 600 UNIQUE - NO REPEATS
const uniqueNames=["Inception","Interstellar","Avatar 2","Avengers Endgame","The Dark Knight","Squid Game","Stranger Things","Wednesday","Naruto Shippuden","One Piece Red","Demon Slayer Mugen Train","Attack on Titan Final","Jujutsu Kaisen 0","My Hero Academia Heroes","Dragon Ball Super Broly","Black Clover Sword","One Punch Man S3","Bleach TYBW","Chainsaw Man Reze","Spy x Family Code White","Frozen 2","Moana 2","Encanto","Coco","Toy Story 5","Spider-Verse 2","Money Heist Berlin","Lupin S3","Boruto Movie","Dragon Ball Z","Jujutsu Kaisen Shibuya","Demon Slayer Hashira","One Piece Stampede","Naruto The Last","Bleach Hell Verse","MHA World Mission","Black Clover Magic","Chainsaw Man Movie","Spy x Family Anya","Avatar Way of Water","Avengers Secret Wars","Spider-Man No Way Home","John Wick 4","Fast X","Oppenheimer","Barbie","Dune 2","Godzilla Minus One","Kung Fu Panda 4","Inside Out 2","Despicable Me 4","Sonic 3","Squid Game S2","One Piece Live Action","Naruto Bonds","One Piece Gold","Demon Slayer Village","Attack on Titan Wings","Jujutsu Kaisen Culling"];

let allMovies=[];
let used = new Set();
for(let i=1;i<=600;i++){
  let base = uniqueNames[(i-1) % uniqueNames.length];
  let cycle = Math.floor((i-1)/uniqueNames.length)+1;
  let title = cycle==1 ? `${base} EP ${i}` : `${base} S${cycle} EP ${i}`;
  if(used.has(title)) title = `${base} #${i} Unique`;
  used.add(title);
  allMovies.push({
    id:i,
    title:title,
    poster: i<=10 ? `https://image.tmdb.org/t/p/w200/${['9gk7adHYeDvHkCSEqAvQNLV5Uge','qJ2tW6WMUDux911r6m7haRef0WH','gEU2QniE6E77NI6lCU6MxlNBvIx','6EiRUJpuoeQPghrs3YNktfnqOVh','RYMX2wcKCBAr24UyPD7xwmjaTn'][i%5]}.jpg` : `https://picsum.photos/seed/UNIQUEHUB${i}/300/450`,
    cat: i%3==0 ? "Anime Dail" : (i%7==0 ? "Top 10" : "Trending Now")
  });
}

function render(list){let g=document.getElementById('grid');g.innerHTML='';list.forEach(m=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<img src="${m.poster}" loading="lazy"><div class="card-title">${m.title}</div>`;c.onclick=()=>playMovie(m);g.appendChild(c);});}
render(allMovies);
function doSearch(){let q=document.getElementById('search').value.toLowerCase();if(!q){render(allMovies);return}render(allMovies.filter(m=>m.title.toLowerCase().includes(q)));}
function playMovie(m){current=m;document.getElementById('pTitle').innerText=m.title;document.getElementById('player').style.display='flex';document.getElementById('adBar').style.display='flex';let sec=5;document.getElementById('timer').innerText=sec;let t=setInterval(()=>{sec--;document.getElementById('timer').innerText=sec;if(sec<=0){clearInterval(t);skipAd();}},1000);buildQ();}
function skipAd(){document.getElementById('adBar').style.display='none';let v=document.getElementById('vid');v.poster=current.poster;v.src=freeSrc[currentQuality];v.load();v.play().then(()=>{document.getElementById('adStatus').innerText="Playing "+currentQuality;}).catch(()=>{document.getElementById('msg').innerText="Tap ▶ in center to play";});}
function buildQ(){let box=document.getElementById('qBtns');box.innerHTML='';['360p','480p','720p','1080p'].forEach(q=>{let btn=document.createElement('button');btn.innerText=q+(q=='720p'||q=='1080p'?' 🔒':'');if(q==currentQuality)btn.className='active';if(q=='720p'||q=='1080p')btn.className+=' premium';btn.onclick=()=>setQ(q);box.appendChild(btn);});}
function setQ(q){currentQuality=q;if((q=='720p'||q=='1080p')&&!isPremium){document.getElementById('premiumModal').style.display='flex';return;}buildQ();let v=document.getElementById('vid');if(v.src){v.poster=current.poster;v.src=freeSrc[q];v.load();v.play();document.getElementById('adStatus').innerText="Playing "+q;}}
function closePremium(){document.getElementById('premiumModal').style.display='none';setQ('480p');}
function unlockPremium(){localStorage.setItem('static_premium','yes');isPremium=true;document.getElementById('premiumModal').style.display='none';setQ('720p');}
function downloadNow(){let a=document.createElement('a');a.href=freeSrc[currentQuality];a.download=current.title+"-"+currentQuality+".mp4";a.click();}
function saveNow(){let s=JSON.parse(localStorage.getItem('hub_save')||'[]');if(!s.includes(current.id)){s.push(current.id);localStorage.setItem('hub_save',JSON.stringify(s));}document.getElementById('msg').innerText="Saved ❤";}
function closeP(){document.getElementById('player').style.display='none';let v=document.getElementById('vid');v.pause();v.src='';}
</script>
</body>
</html>
